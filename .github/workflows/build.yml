name: Build RegionShot

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "README.md"
      - "DEVELOPMENT_REPORT.md"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Check independent cropped pixels
        run: clang -Wall -Wextra -Werror -framework CoreGraphics -framework Foundation Tests/test_pixels.m -o /tmp/regionshot-pixels && /tmp/regionshot-pixels
      - name: Check history persistence and retention
        run: clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation Tests/test_history.m History/RSHistoryStore.m -o /tmp/regionshot-history && /tmp/regionshot-history
      - name: Check settings validation
        run: clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation Tests/test_options.m Preferences/RSOptions.m -o /tmp/regionshot-options && /tmp/regionshot-options
      - name: Check screenshot symbol resolution
        run: |
          clang -Wall -Wextra -Werror -Wl,-export_dynamic Tests/test_capture_symbol.c -o /tmp/regionshot-symbol
          /tmp/regionshot-symbol
          clang -Wall -Wextra -Werror -Wl,-export_dynamic -DLEGACY_ONLY Tests/test_capture_symbol.c -o /tmp/regionshot-symbol-legacy
          /tmp/regionshot-symbol-legacy
      - name: Check integrated KeyboardAI segmentation
        run: clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation Tests/test_keyboardai.m -o /tmp/regionshot-keyboardai && /tmp/regionshot-keyboardai
      - name: Check crop geometry
        run: cc -std=c11 -Wall -Wextra -Werror Tests/test_geometry.c -lm -o /tmp/regionshot-geometry && /tmp/regionshot-geometry
      - name: Check streaming packet boundaries
        run: clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation Tests/test_stream.m AI/RSSSEDecoder.m -o /tmp/regionshot-stream && /tmp/regionshot-stream
      - name: Check long screenshot alignment
        run: cc -std=c11 -Wall -Wextra -Werror Tests/test_stitch.c -lm -o /tmp/regionshot-stitch && /tmp/regionshot-stitch
      - name: Check generated QR recognition
        run: clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation -framework Vision -framework CoreImage -framework CoreGraphics -framework ImageIO Tests/test_recognition.m -o /tmp/regionshot-recognition && /tmp/regionshot-recognition
      - name: Upload QR diagnostic image
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recognition-diagnostic
          path: /tmp/regionshot-test-qr.png
      - name: Install signing tools
        run: brew install ldid xz
      - name: Install pinned RootHide Theos and iOS 15.6 SDK
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$THEOS" submodule update --init --recursive
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS15.6.sdk
          git -C "$RUNNER_TEMP/sdks" checkout 0222fd5413cf4b9af096f37b4621afa2688572f7
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS15.6.sdk" "$THEOS/sdks/"
      - name: Build package
        run: make clean package FINALPACKAGE=1
      - name: Verify installable Settings bundle
        run: python3 Tests/check_package.py packages/*.deb
      - name: Verify package and modern arm64e ABI
        run: |
          python3 - <<'PY'
          import pathlib, struct
          binary = pathlib.Path('.theos/obj/arm64e/RegionShot.dylib').read_bytes()
          magic, cpu, subtype = struct.unpack_from('<III', binary)
          assert magic == 0xfeedfacf and cpu == 0x100000c, 'Expected thin ARM64 Mach-O'
          assert subtype == 0x80000002, f'Expected modern arm64e ABI, got {subtype:#x}'
          packages = list(pathlib.Path('packages').glob('*.deb'))
          assert len(packages) == 1, f'Expected one deb, got {len(packages)}'
          print(f'Verified {packages[0]} and modern arm64e ABI')
          PY
          find .theos/_ -type f | grep -E 'RegionShot\.dylib|RegionShot\.plist'
      - uses: actions/upload-artifact@v4
        with:
          name: RegionShot-roothide-arm64e
          path: packages/*.deb
          if-no-files-found: error
